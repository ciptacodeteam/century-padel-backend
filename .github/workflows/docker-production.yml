name: Build & Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

# Required so GITHUB_TOKEN can push images to GHCR (and read them on pull).
permissions:
  contents: read
  packages: write

# Serialize production deploys so overlapping pushes don't race on the VPS.
# Queue (don't cancel) in-flight runs so an older commit's deploy finishes
# cleanly before the next one starts.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # CI gate: must pass before anything is built or deployed.
  # ---------------------------------------------------------------------------
  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    env:
      # postinstall runs `prisma generate`, which loads prisma.config.ts and
      # requires DATABASE_URL. No real database is needed — generate is offline.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  # ---------------------------------------------------------------------------
  # Build the image on the runner and deploy to the VPS by pulling it.
  # ---------------------------------------------------------------------------
  build-and-deploy:
    name: Build image & deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # GHCR image names must be lowercase. Derive it from the repo owner.
      - name: Compute image name
        id: img
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${OWNER}/century-padel-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build on the fresh runner (NOT the VPS) and push to GHCR.
      # Tag with both the commit SHA (immutable, for rollbacks) and `latest`.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY_B64 }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$SSH_KEY_B64" ]; then
            echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "❌ Invalid SSH private key in GitHub secret."
            echo "   Fix DO_SSH_PRIVATE_KEY or set DO_SSH_PRIVATE_KEY_B64 (recommended on Windows)."
            exit 1
          fi
          echo "Deploy key fingerprint (must match VPS authorized_keys):"
          ssh-keygen -lf ~/.ssh/deploy_key

      - name: Add Known Hosts
        run: ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      # Deploy by pulling the prebuilt image on the VPS — no build on the droplet.
      # The GITHUB_TOKEN is valid for the duration of this run and lets the VPS
      # pull the (private) image without a long-lived Personal Access Token.
      - name: Deploy to DigitalOcean Droplet
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS -p ${{ secrets.DO_SSH_PORT }} ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} \
            "APP_IMAGE='$APP_IMAGE' REGISTRY='$REGISTRY' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' PROJECT_PATH='${{ secrets.DO_PROJECT_PATH }}' bash -s" << 'EOF'
          set -e
          cd "$PROJECT_PATH"
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          BEFORE_HEAD="$(git rev-parse HEAD 2>/dev/null || true)"
          git pull origin main
          AFTER_HEAD="$(git rev-parse HEAD 2>/dev/null || true)"
          # Tell deploy-registry.sh which files changed so it can reload nginx
          # when its config templates change (the pull happens here, not in the script).
          CHANGED_FILES="$(git diff --name-only "$BEFORE_HEAD" "$AFTER_HEAD" 2>/dev/null || true)"
          chmod +x scripts/*.sh scripts/lib/*.sh deploy.sh docker/*.sh 2>/dev/null || true
          APP_IMAGE="$APP_IMAGE" CHANGED_FILES="$CHANGED_FILES" AUTO_DEPLOY=true SKIP_PULL_CODE=true bash scripts/deploy-registry.sh
          docker logout "$REGISTRY" || true
          EOF

      # Smoke test the live app over the existing SSH connection. The app binds
      # to 127.0.0.1:$PORT on the VPS, so we probe it locally with retries.
      # A failure here fails the workflow (and surfaces a rollback signal).
      - name: Verify deployment health
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS -p ${{ secrets.DO_SSH_PORT }} ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} \
            "PROJECT_PATH='${{ secrets.DO_PROJECT_PATH }}' bash -s" << 'EOF'
          set -e
          cd "$PROJECT_PATH"
          PORT="$(grep -E '^PORT=' .env.production 2>/dev/null | head -n1 | cut -d= -f2 | tr -d '\r' || true)"
          PORT="${PORT:-8000}"
          echo "Probing http://127.0.0.1:${PORT}/health ..."
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/health" >/dev/null; then
              echo "✅ Health check passed on attempt ${i}"
              exit 0
            fi
            echo "  attempt ${i}/12 not ready; retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed after retries — app did not become healthy"
          exit 1
          EOF

      - name: Deployment Status
        if: success()
        run: |
          echo "✅ Deployment completed successfully! Image: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Deployment failed. Check the logs above."
